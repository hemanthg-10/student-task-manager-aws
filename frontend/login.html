<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your Student Task Manager account to access your tasks, assignments, and academic overview.">
  <title>Login — Student Task Manager</title>

  <!-- Apply saved theme immediately — prevents flash -->
  <script>
    (function() {
      var saved = localStorage.getItem('stm_theme');
      var preferred = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', preferred);
      document.documentElement.setAttribute('data-bs-theme', preferred);
    })();
  </script>

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- App Styles -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/3d-effects.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/interface-scale.css?v=scale-20260930">
</head>
<body class="auth-page">

  <!-- Header -->
  <header class="auth-header">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="app-brand" id="authBrandLink">
        <div class="brand-icon-box"><i class="bi bi-check2-square"></i></div>
        <span>Student<span class="text-primary">TaskManager</span></span>
      </a>
      <button
        type="button"
        class="btn-theme-toggle"
        id="themeToggleLogin"
        aria-label="Switch to dark mode"
        title="Switch to dark mode"
      >
        <i class="bi bi-sun-fill theme-icon-sun"></i>
        <i class="bi bi-moon-fill theme-icon-moon"></i>
      </button>
    </div>
  </header>

  <!-- Auth Card -->
  <main class="auth-container">
    <div class="auth-card">
      <div class="text-center mb-4">
        <h1 class="auth-card-title">Welcome back</h1>
        <p class="auth-card-subtitle">Enter your credentials to access your task dashboard</p>
      </div>

      <!-- Alert -->
      <div id="authAlert" class="auth-alert" role="alert" aria-live="polite"></div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="loginEmail" class="form-label">Email Address <span class="text-danger">*</span></label>
          <div class="input-icon-group">
            <i class="bi bi-envelope input-icon"></i>
            <input
              type="email"
              class="form-control"
              id="loginEmail"
              placeholder="alex.johnson@university.edu"
              value="alex.johnson@university.edu"
              required
              autocomplete="email"
            >
          </div>
        </div>

        <div class="mb-3">
          <label for="loginPassword" class="form-label">Password <span class="text-danger">*</span></label>
          <div class="input-icon-group">
            <i class="bi bi-lock input-icon"></i>
            <input
              type="password"
              class="form-control pe-5"
              id="loginPassword"
              placeholder="Enter your password"
              value="StudentPass123!"
              required
              autocomplete="current-password"
            >
            <button type="button" class="password-toggle-btn" data-target="loginPassword" aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" checked>
            <label class="form-check-label small" for="rememberMe" style="color: var(--text-muted);">
              Remember me on this device
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2" id="btnLoginSubmit">
          <span>Sign In</span>
          <i class="bi bi-box-arrow-in-right"></i>
        </button>
      </form>

      <div class="auth-footer-text">
        <span>Don't have an account?</span>
        <a href="register.html" class="fw-semibold ms-1" id="linkToRegister">Register now</a>
      </div>
    </div>
  </main>

  <!-- Toast Container -->
  <div id="toastPlacement" class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite" aria-atomic="true"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js?v=notifications-20260930"></script>
  <script src="js/animations.js"></script>
  <script src="js/3d-effects.js"></script>
  <script src="js/api.js?v=alb-api-20260930"></script>
  <script src="js/auth.js"></script>
</body>
</html>
