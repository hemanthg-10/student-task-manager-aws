<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register an account on Student Task Manager to begin organizing your assignments, exams, and academic milestones.">
  <title>Create Account — Student Task Manager</title>

  <!-- Apply saved theme immediately — prevents flash -->
  <script>
    (function() {
      var saved = localStorage.getItem('stm_theme');
      var preferred = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', preferred);
      document.documentElement.setAttribute('data-bs-theme', preferred);
    })();
  </script>

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- App Styles -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/3d-effects.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/interface-scale.css?v=scale-20260930">
</head>
<body class="auth-page">

  <!-- Header -->
  <header class="auth-header">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="app-brand" id="authBrandLink">
        <div class="brand-icon-box"><i class="bi bi-check2-square"></i></div>
        <span>Student<span class="text-primary">TaskManager</span></span>
      </a>
      <button
        type="button"
        class="btn-theme-toggle"
        id="themeToggleRegister"
        aria-label="Switch to dark mode"
        title="Switch to dark mode"
      >
        <i class="bi bi-sun-fill theme-icon-sun"></i>
        <i class="bi bi-moon-fill theme-icon-moon"></i>
      </button>
    </div>
  </header>

  <!-- Auth Card -->
  <main class="auth-container">
    <div class="auth-card">
      <div class="text-center mb-4">
        <h1 class="auth-card-title">Create your account</h1>
        <p class="auth-card-subtitle">Organize your assignments and boost your productivity</p>
      </div>

      <!-- Alert -->
      <div id="authAlert" class="auth-alert" role="alert" aria-live="polite"></div>

      <!-- Registration Form -->
      <form id="registerForm" novalidate>
        <!-- Full Name -->
        <div class="mb-3">
          <label for="regFullName" class="form-label">Full Name <span class="text-danger">*</span></label>
          <div class="input-icon-group">
            <i class="bi bi-person input-icon"></i>
            <input type="text" class="form-control" id="regFullName" placeholder="e.g. Alex Johnson" required autocomplete="name">
          </div>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="regEmail" class="form-label">Email Address <span class="text-danger">*</span></label>
          <div class="input-icon-group">
            <i class="bi bi-envelope input-icon"></i>
            <input type="email" class="form-control" id="regEmail" placeholder="name@university.edu" required autocomplete="email">
          </div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="regPassword" class="form-label">Password <span class="text-danger">*</span></label>
          <div class="input-icon-group">
            <i class="bi bi-lock input-icon"></i>
            <input type="password" class="form-control pe-5" id="regPassword" placeholder="At least 8 characters" required autocomplete="new-password">
            <button type="button" class="password-toggle-btn" data-target="regPassword" aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>

          <!-- Password Strength -->
          <div class="password-strength-container mt-2">
            <div class="strength-bar-track">
              <div class="strength-bar-fill" id="strengthFill"></div>
            </div>
            <div class="strength-text">
              <span>Password strength</span>
              <span id="strengthText" class="fw-semibold" style="color: var(--text-muted);">None</span>
            </div>
            <ul class="strength-criteria">
              <li id="crit-len"><i class="bi bi-circle"></i> At least 8 characters</li>
              <li id="crit-case"><i class="bi bi-circle"></i> Upper &amp; lowercase letters</li>
              <li id="crit-num"><i class="bi bi-circle"></i> At least one number</li>
              <li id="crit-spec"><i class="bi bi-circle"></i> At least one special character</li>
            </ul>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="mb-4">
          <label for="regConfirmPassword" class="form-label">Confirm Password <span class="text-danger">*</span></label>
          <div class="input-icon-group">
            <i class="bi bi-shield-lock input-icon"></i>
            <input type="password" class="form-control pe-5" id="regConfirmPassword" placeholder="Re-enter your password" required autocomplete="new-password">
            <button type="button" class="password-toggle-btn" data-target="regConfirmPassword" aria-label="Toggle confirm password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2" id="btnRegisterSubmit">
          <span>Create Account</span>
          <i class="bi bi-arrow-right"></i>
        </button>
      </form>

      <div class="auth-footer-text">
        <span>Already have an account?</span>
        <a href="login.html" class="fw-semibold ms-1" id="linkToLogin">Login</a>
      </div>
    </div>
  </main>

  <!-- Toast Container -->
  <div id="toastPlacement" class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite" aria-atomic="true"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js?v=notifications-20260930"></script>
  <script src="js/animations.js"></script>
  <script src="js/3d-effects.js"></script>
  <script src="js/api.js?v=alb-api-20260930"></script>
  <script src="js/auth.js"></script>
</body>
</html>
